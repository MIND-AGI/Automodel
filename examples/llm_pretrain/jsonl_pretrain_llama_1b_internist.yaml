# Example config for pretraining LLaMA 1B on JSONL data using the BufShufSJSONLDataset and FSDP2Manager.
# Internist is enabled in this config, see nemo_automodel/components/internist for more details on how to use and customize internist.
# This config is meant to be used with examples/llm_pretrain/pretrain.py
# To run:
# 1. Update the file paths in the config as needed (e.g. dataset file_pattern, checkpoint_dir, pretrained_model_name_or_path)
# 2. sbatch examples/llm_pretrain/pretrain.sbatch

# Training config
step_scheduler:
  global_batch_size: 1024
  local_batch_size: 8
  ckpt_every_steps: 2000
  val_every_steps: 2000 
  num_epochs: 1
  max_steps: 40000

dist_env:
  backend: nccl
  timeout_minutes: 30

# Model
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: NousResearch/Llama-3.2-1B
    trust_remote_code: True
  torch_dtype: float32
  trust_remote_code: True
  force_hf: True
  use_liger_kernel: False

# Checkpointing
checkpoint:
  enabled: True
  checkpoint_dir: nemo_experiments/checkpoints/llama_1B
  model_save_format: safetensors
  save_consolidated: False
  load_base_model: False
  # restore_from: nemo_experiments/checkpoints/llama_1B/epoch_0_step_9

# Internist
internist: 
  activation_internist:
    enabled: true
    interval: 10
    enable_grad_norm: true
  weight_internist:
    enabled: true
    interval: 10

# Dataset
dataset:
  _target_: nemo_automodel.components.datasets.llm.bufshuf_sjsonl_dataset.BufShufSJSONLDataset
  file_pattern: /path/to/fineweb-edu-100BT_jsonl/chunk.*.jsonl
  seq_len: 2048
  sample_buffer_size: 1024
  shuffle_files: true
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: NousResearch/Llama-3.2-1B
  tokenizer_config:
    add_bos: true
    add_eos: true
    max_length: 32768

# Dataloader
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 8
  prefetch_factor: 2

# Loss
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

# DDP / FSDP2 / etc
distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  dp_size: none
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

# LR Scheduler
lr_scheduler:
  lr_decay_style: cosine
  min_lr: 3.0e-5 
  lr_warmup_steps: 1500

# Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>